<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cloud Security Center</title>
    <script>
      // Light Mode opt-in — يطبّق كلاس light قبل أول رسم لو محفوظ.
      // الافتراضي يفضل dark كما هو (بدون كلاس).
      try {
        if (localStorage.getItem('aegis-theme') === 'light') {
          document.documentElement.classList.add('light');
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
